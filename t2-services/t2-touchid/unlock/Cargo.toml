[package]
name = "t2-manual-unlock"
version = "0.1.0"
edition = "2024"
autobins = false
license = "GPL-3.0-or-later"
description = "Opt-in guarded manual T2 keybag unlock and read-only preparation checks"

[dependencies]
t2-bridgexpc = { path = "../../shared/protocols/t2-bridgexpc" }
anyhow = "1.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
zeroize = "1"

[[bin]]
name = "t2-touchid-unlock"
path = "src/main.rs"

[[bin]]
name = "t2-keybag-unlock"
path = "src/bin/t2-keybag-unlock.rs"

[[bin]]
name = "t2-touchid-link-ready"
path = "src/bin/t2-touchid-link-ready.rs"
