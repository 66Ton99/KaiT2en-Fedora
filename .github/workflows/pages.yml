name: Deploy site

on:
  push:
    branches: [main]

  pull_request:
    paths:
      - website/**
      - scripts/ci/**
      - .github/workflows/pages.yml

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-root
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install site dependencies
        run: pip install -r website/requirements.txt

      - name: Build the site
        run: python website/build.py

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./website/build
          retention-days: 7

  deploy:
    needs: build
    # A fork has no deploy key and must not publish kait2en.org. It still gets
    # the build job above as a check, and `build.py --serve` for a local preview.
    if: >-
      github.event_name != 'pull_request'
      && github.repository == 'kaiT2en/KaiT2en-Fedora'
    runs-on: ubuntu-24.04

    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: ./website/build

      # gh-pages still holds the old MkDocs build and is kept untouched as a
      # rollback: pointing the Pages source back at it restores the old site.
      - name: Publish to kait2en.org
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
          external_repository: kaiT2en/kait2en.github.io
          publish_branch: gh-pages-v2
          publish_dir: ./website/build
          force_orphan: true
          cname: kait2en.org
